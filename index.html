<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lottery Training Simulator</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a1845;font-family:Arial,sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0a1845}::-webkit-scrollbar-thumb{background:#3a6cc0;border-radius:3px}
.num-btn{display:flex;align-items:center;justify-content:center;width:50px;height:34px;border:2px solid #556eaa;background:#162566;color:#dde;font-size:14px;font-weight:bold;cursor:pointer;border-radius:4px;transition:all .1s;user-select:none}
.num-btn:hover{background:#1e3580;border-color:#ffd700}.num-btn.sel{background:#b30000;border-color:#ff5555;color:#fff}
.game-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 6px;border:2px solid #3a55aa;background:#162566;cursor:pointer;border-radius:4px;min-width:60px;min-height:42px;transition:all .15s;user-select:none}
.game-tab:hover{border-color:#ffd700;background:#1e3580}.game-tab.act{border-color:#ffd700;background:#1e3880;box-shadow:0 0 8px #ffd70066}
.chip-btn{padding:6px 14px;border-radius:4px;font-weight:bold;font-size:13px;cursor:pointer;border:2px solid;transition:all .15s;user-select:none}
.chip-btn.sel{background:#b30000;border-color:#ff5555;color:#fff}
.chip-btn:not(.sel){background:#162566;border-color:#556eaa;color:#ccd}.chip-btn:hover:not(.sel){border-color:#ffd700}
.act-btn{padding:9px 18px;border-radius:6px;font-weight:bold;font-size:13px;cursor:pointer;border:2px solid;transition:all .15s;user-select:none}
.circ{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;cursor:pointer;border:2px solid rgba(255,255,255,.4);transition:transform .1s;flex-shrink:0}
.circ:hover{transform:scale(1.12)}
.col-lbl{color:#ffd700;font-size:10px;font-weight:bold;text-align:center;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.diff-btn{padding:7px 14px;border-radius:6px;font-weight:bold;font-size:12px;cursor:pointer;border:2px solid;transition:all .15s;user-select:none;text-align:center}
.mode-btn{padding:6px 12px;border-radius:5px;font-weight:bold;font-size:12px;cursor:pointer;border:2px solid;transition:all .15s;user-select:none}
.blurred{filter:blur(8px);user-select:none;pointer-events:none}
.ticket-card{background:#fff;border-radius:8px;padding:10px;color:#111;font-family:'Courier New',monospace;font-size:11px;border:1px solid #ccc;box-shadow:2px 3px 8px rgba(0,0,0,.4);position:relative;overflow:hidden;width:170px;min-height:200px;flex-shrink:0}
.ticket-result-banner{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:14px;font-weight:900;z-index:10;border-radius:8px}
.barcode-lines{display:flex;gap:1px;height:22px;align-items:flex-end;overflow:hidden;margin:4px 0}
.fanned{position:absolute;transition:transform .3s}
@keyframes handoff{0%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(-200px)}}
.handing{animation:handoff .5s forwards}
@keyframes scanpulse{0%,100%{border-color:#3a55aa}50%{border-color:#00cfff;box-shadow:0 0 16px #00cfff88}}
.scanning-anim{animation:scanpulse .4s ease-in-out 4}

/* ── TIMER ── */
.timer-wrap{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:80px;height:80px;border-radius:50%;border:4px solid #2a3a70;background:rgba(0,0,0,.35);flex-shrink:0}
.timer-num{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;transition:color .3s}
.timer-label{font-size:9px;color:#556eaa;letter-spacing:1px;margin-top:2px}
@keyframes dangerBurst{
  0%{transform:scale(1.0);color:#ff2222;text-shadow:0 0 0px #ff0000}
  25%{transform:scale(1.55);color:#ff0000;text-shadow:0 0 18px #ff0000}
  55%{transform:scale(1.2);color:#ff3333;text-shadow:0 0 8px #ff4444}
  80%{transform:scale(1.45);color:#ff0000;text-shadow:0 0 16px #ff0000}
  100%{transform:scale(1.35);color:#ff2222;text-shadow:0 0 10px #ff2222}
}
@keyframes dangerRing{
  0%,100%{border-color:#aa0000;box-shadow:0 0 0px #ff000000}
  40%{border-color:#ff0000;box-shadow:0 0 18px #ff000088}
}
.danger-num{animation:dangerBurst .85s ease-in-out forwards;display:inline-block}
.danger-ring{animation:dangerRing .85s ease-in-out forwards;border-color:#aa0000!important}
.timer-bar-wrap{width:100%;height:8px;background:#0d1a50;border-radius:4px;overflow:hidden;border:1px solid #2a3a70;margin-top:6px}
.timer-bar-fill{height:100%;border-radius:4px;transition:width 1s linear,background .4s}

@media(max-width:620px){.main-flex{flex-direction:column!important}}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

const SESSION_SIZE=20;
const BASE_POINTS=100;
const DIFF_TIMER={easy:15,medium:11,hard:9,insane:8};
const DIFF_PASS={easy:10,medium:12,hard:16,insane:19};
const DIFF_INFO={
  easy:{label:'Easy',emoji:'🟢',desc:'Clear standard English',timer:15,pass:10},
  medium:{label:'Medium',emoji:'🟡',desc:'Casual with some slang',timer:11,pass:12},
  hard:{label:'Hard',emoji:'🔴',desc:'Heavy slang, curses, twists',timer:9,pass:16},
  insane:{label:'Ich Will Sterben',emoji:'💀',desc:'Pure chaos. God help you.',timer:8,pass:19},
};

// ═══ EMOTION PROFILES ════════════════════════════════════════════════════════
// rate, pitch, volume — tuned to feel human, not robotic
const EMOTIONS={
  friendly:   {id:'friendly',  label:'Friendly',   rate:.84, pitch:1.08, vol:1.0},
  helpful:    {id:'helpful',   label:'Helpful',    rate:.80, pitch:1.05, vol:1.0},
  impatient:  {id:'impatient', label:'Impatient',  rate:1.06,pitch:1.02, vol:1.0},
  grumpy:     {id:'grumpy',    label:'Grumpy',     rate:.91, pitch:.78,  vol:.95},
  excited:    {id:'excited',   label:'Excited',    rate:1.0, pitch:1.22, vol:1.0},
  mumbling:   {id:'mumbling',  label:'Mumbling',   rate:.76, pitch:.88,  vol:.88},
  rushing:    {id:'rushing',   label:'Rushing',    rate:1.12,pitch:1.04, vol:1.0},
  confused:   {id:'confused',  label:'Confused',   rate:.79, pitch:.92,  vol:.95},
  casual:     {id:'casual',    label:'Casual',     rate:.86, pitch:1.0,  vol:1.0},
  tired:      {id:'tired',     label:'Tired',      rate:.75, pitch:.82,  vol:.9},
};
const EMOTION_POOL={
  easy:   ['friendly','helpful','casual','excited'],
  medium: ['friendly','impatient','casual','confused','tired'],
  hard:   ['impatient','grumpy','rushing','confused','mumbling'],
  insane: ['rushing','grumpy','impatient','tired','mumbling'],
};

// ═══ GAME CONFIG ═════════════════════════════════════════════════════════════
const GAMES={
  macks:{id:'macks',name:'Lotto Macks',sub:'(Lotto Max)',sn:'LOTTO\nMACKS',col:'#ffcc00',params:['boards','draws','encore'],bMax:10,dMax:10,eMax:10},
  g650:{id:'g650',name:'Lotto 6/50',sub:'(Lotto 6/49)',sn:'LOTTO\n6/50',col:'#ffd700',params:['boards','draws','encore','addOn'],bMax:10,dMax:10,eMax:10,aoLabel:'Play 6/50 Add-on?'},
  ont50:{id:'ont50',name:"L'Ontario 50",sub:'(Ontario 49)',sn:"L'ONT\n50",col:'#ff8800',params:['boards','draws','encore'],bMax:10,dMax:10,eMax:10},
  lightning:{id:'lightning',name:'Lightning Lotts',sub:'(Lightning Lotto)',sn:'LTNG\nLOTTS',col:'#00cfff',params:['boards'],bMax:5},
  joker:{id:'joker',name:'Joker Lotto',sub:'(Poker Lotto)',sn:'JOKER\nLOTTO',col:'#dd44dd',params:['selections','addOn'],sMax:3,aoLabel:'Play Joker Lotto?'},
  powerbux:{id:'powerbux',name:'Power Bux',sub:'(Power Bucks)',sn:'POWER\nBUX',col:'#44ddaa',params:['boards','draws'],bMax:10,dMax:10},
  wheelrich:{id:'wheelrich',name:'Wheel of Riches',sub:'(Wheel of Fortune)',sn:'WHEEL\nRICHES',col:'#ff6644',params:['boards','spins'],bMax:5,spinMax:5},
  cardlotto:{id:'cardlotto',name:'Card Lotto',sub:'(Poker variant)',sn:'CARD\nLOTTO',col:'#88aaff',params:['selections','addOn'],sMax:5,aoLabel:'Play Card Add-on?'},
  duo:{id:'duo',name:'Duo Pick',sub:'(Pick 2)',sn:'DUO\nPICK',col:'#aaffaa',params:['playType','wager','draws'],playTypes:['Straight','Straight/Box'],wagers:[0.5,1,2],dMax:7},
  triple:{id:'triple',name:'Triple Pick',sub:'(Pick 3)',sn:'TRIPLE\nPICK',col:'#ffaacc',params:['playType','wager','draws'],playTypes:['Straight','Box','S+B','Combo'],wagers:[0.5,1,2],dMax:7},
  quad:{id:'quad',name:'Quad Pick',sub:'(Pick 4)',sn:'QUAD\nPICK',col:'#ccaaff',params:['playType','wager','draws'],playTypes:['Straight','Box','S+B','Combo','Front Pair','Back Pair'],wagers:[0.5,1],dMax:7},
};

const rng=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

// ═══ VOCABULARY SUBSTITUTIONS ════════════════════════════════════════════════
const boardWord=(n,diff)=>{
  const pools={
    easy:['board'],
    medium:['board','line','ticket'],
    hard:['line','play','set','bet','strip'],
    insane:['line','play','set','thing','one of those'],
  };
  const base=pick(pools[diff]||pools.easy);
  return n===1?base:base+(base.endsWith('s')?'':base==='strip'?'s':'s');
};
const drawWord=(n,diff)=>{
  const pools={
    easy:['draw'],
    medium:['draw','time','play'],
    hard:['time','week','pull','round','shot'],
    insane:['time','week','pull','shot','go'],
  };
  const base=pick(pools[diff]||pools.easy);
  return n===1?base:base+'s';
};
const encoreWord=(n,diff)=>{
  if(n===0){
    const pools={
      easy:['no encore'],
      medium:['no encore','skip the encore','no add-on'],
      hard:['skip the extra','no encore','forget the bonus','no add-on','ditch the extra'],
      insane:["no—skip that extra thing","forget it","no encore whatever that is","no add-on crap"],
    };
    return pick(pools[diff]||pools.easy);
  }
  const label={
    easy:'encore',
    medium:pick(['encore','the add-on','the extra']),
    hard:pick(['encore','that extra one','the bonus','the add-on thing','the extra number']),
    insane:pick(['encore','that... the extra whatcha-call-it','the bonus thing','that number add-on']),
  }[diff]||'encore';
  return`${numWord(n,diff)} ${label}`;
};
const numWord=(n,diff)=>{
  if(diff==='easy')return String(n);
  const med={0:'zero',1:'one',2:'two',3:'three',4:'four',5:'five',6:'six',7:'seven',8:'eight',9:'nine',10:'ten'};
  if(diff==='medium')return pick([String(n),med[n]||String(n)]);
  const sl={0:['zero','zilch','zip'],1:['one','uno','a single','just one'],2:['two','a couple','a deuce','dos'],3:['three','a trey','a few','tres'],4:['four','a quad'],5:['five','a fiver'],6:['six','half a dozen'],7:['seven','lucky seven'],8:['eight'],9:['nine'],10:['ten','a tenner']};
  return pick(sl[n]||[String(n)]);
};
const gameName=(gid,diff)=>{
  const g=GAMES[gid];if(diff==='easy'||diff==='medium')return g.name;
  const nk={macks:['the Macks','the big one','that Max thing','the million dollar one'],g650:['six-fifty','that number game','the six-forty-nine style one'],ont50:["the Ontario one","l'Ontario fifty","the provincial one"],lightning:['the lightning one','the quick one','the zappy thing'],joker:['the joker thing','that card poker one','joker'],powerbux:['power bux','the power one'],wheelrich:['the wheel one','that spinner game','the wheel thing'],cardlotto:['card lotto','the other card one'],duo:['pick two','the double','duo pick'],triple:['pick three','triple pick','the three-number thing'],quad:['pick four','quad pick','the four-digit one']};
  return pick(nk[gid]||[g.name]);
};

// ═══ SENTENCE BUILDERS ═══════════════════════════════════════════════════════
const OPENERS={
  easy:['Can I get','Please give me','I would like','Give me','I need'],
  medium:['Yeah gimme','Can I get','Lemme get','Give me','Hey can I get'],
  hard:['Yo gimme','Oi bud gimme','Heyyy can I get','Bud I want','Aight gimme'],
  insane:['Oh for the love of—gimme','So uh... right, I want','Jesus okay so','OKAY so listen','Hold on— alright—'],
};
function buildSentence(o,g,diff){
  const op=pick(OPENERS[diff]||OPENERS.easy);
  const bw=(n)=>boardWord(n,diff); const dw=(n)=>drawWord(n,diff); const gn=gameName(g.id,diff);
  const eh=diff==='hard'||diff==='insane'?(Math.random()>.5?' eh':''):'';
  const bud=(diff==='hard'||diff==='insane')&&Math.random()>.5?' bud':'';
  if(diff==='insane'){
    const wb=o.boards===1?2:o.boards-1;const wd=o.draws===1?2:o.draws-1;
    const cr=pick(['wait no','actually','hold on','scratch that','no no']);
    if(['duo','triple','quad'].includes(g.id)){
      const wp=pick(g.playTypes.filter(t=>t!==o.playType)||g.playTypes);
      const wl=o.wager===.5?'fifty cents':o.wager===1?'a loonie':'a toonie';
      return cap(`${op} ${gn}, ${wp.toLowerCase()} play—${cr} ${o.playType.toLowerCase()} play, ${wl}, ${numWord(wd,diff)} ${dw(wd)}—${cr} ${numWord(o.draws,diff)} ${dw(o.draws)}. Final answer.`);
    }
    if(g.id==='lightning')return cap(`${op} ${gn}... ${numWord(wb,diff)} ${bw(wb)}... ${cr} ${numWord(o.boards,diff)} ${bw(o.boards)}. Yeah.`);
    let s=`${op} ${gn}${bud}, ${numWord(wb,diff)} ${bw(wb)}—${cr} ${numWord(o.boards,diff)} ${bw(o.boards)}, ${numWord(wd,diff)} ${dw(wd)}—${cr} ${numWord(o.draws,diff)} ${dw(o.draws)}, ${encoreWord(o.encore,diff)}`;
    if(g.id==='g650')s+=o.addOn?', and—yes—the six-fifty add-on':' no six-fifty';
    return cap(s+'. I think. Yeah.');
  }
  if(g.id==='lightning')return cap(`${op} ${gn}${bud}, ${numWord(o.boards,diff)} ${bw(o.boards)}${eh}.`);
  if(g.id==='joker'||g.id==='cardlotto')return cap(`${op} ${gn}${bud}, ${numWord(o.selections,diff)} selection${o.selections>1?'s':''}${eh}, ${o.addOn?'yes to the add-on':'no add-on'}.`);
  if(g.id==='powerbux')return cap(`${op} ${gn}${bud}, ${numWord(o.boards,diff)} ${bw(o.boards)}, ${numWord(o.draws,diff)} ${dw(o.draws)}${eh}.`);
  if(g.id==='wheelrich')return cap(`${op} ${gn}${bud}, ${numWord(o.boards,diff)} ${bw(o.boards)}, ${numWord(o.spins,diff)} spin${o.spins>1?'s':''}${eh}.`);
  if(['duo','triple','quad'].includes(g.id)){
    const wl=o.wager===.5?diff==='easy'?'fifty cents':'fitty cents':o.wager===1?diff==='easy'?'one dollar':'a loonie':'two dollars';
    return cap(`${op} ${gn}${bud}, ${o.playType.toLowerCase()} play, ${wl}, ${numWord(o.draws,diff)} ${dw(o.draws)}${eh}.`);
  }
  let s=`${op} ${gn}${bud}, ${numWord(o.boards,diff)} ${bw(o.boards)}, ${numWord(o.draws,diff)} ${dw(o.draws)}, ${encoreWord(o.encore,diff)}`;
  if(g.id==='g650')s+=o.addOn?diff==='easy'?', yes to the 6/50 add-on':', and the six-fifty':' no six-fifty';
  return cap(s+`${eh}.`);
}
function generateOrder(diff){
  const pool=['macks','macks','macks','g650','g650','g650','ont50','ont50','ont50','lightning','lightning','joker','joker','powerbux','wheelrich','cardlotto','duo','triple','quad'];
  const gid=pick(pool);const g=GAMES[gid];const o={gameId:gid,diff};
  if(gid==='lightning'){o.boards=rng(1,5);}
  else if(gid==='joker'){o.selections=rng(1,3);o.addOn=Math.random()>.4;}
  else if(gid==='powerbux'){o.boards=rng(1,10);o.draws=rng(1,10);}
  else if(gid==='wheelrich'){o.boards=rng(1,5);o.spins=rng(1,5);}
  else if(gid==='cardlotto'){o.selections=rng(1,5);o.addOn=Math.random()>.4;}
  else if(['duo','triple','quad'].includes(gid)){o.playType=pick(g.playTypes);o.wager=pick(g.wagers);o.draws=rng(1,7);}
  else{o.boards=rng(1,5);o.draws=rng(1,5);o.encore=Math.random()>.5?rng(1,3):0;if(gid==='g650')o.addOn=Math.random()>.5;}
  o.sentence=buildSentence(o,g,diff);return o;
}

// ═══ SCAN TICKET ═════════════════════════════════════════════════════════════
function generateScanTicket(){
  const scannable=['macks','g650','ont50','lightning','powerbux','wheelrich'];
  const gid=pick(scannable);const g=GAMES[gid];
  const isWinner=Math.random()<0.35;const winPool=[2,5,5,10,10,10,20,20,50,100,500];
  const winAmount=isWinner?pick(winPool):0;
  const nums=[];while(nums.length<6){const n=rng(1,gid==='macks'?50:49);if(!nums.includes(n))nums.push(n);}nums.sort((a,b)=>a-b);
  const bonus=rng(1,20);const boards=rng(1,3);
  const d=new Date(Date.now()-rng(0,6)*86400000);
  const drawDate=d.toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'});
  const ticketId=Math.random().toString(36).substr(2,4).toUpperCase()+'-'+Math.random().toString(36).substr(2,4).toUpperCase();
  let customerWants;
  if(isWinner)customerWants=winAmount>=50?pick(['cash','cash','playAgain']):pick(['cash','playAgain','playAgain']);
  else customerWants=pick(['buyNew','leave','leave']);
  const presents=["Can you scan this for me?","Check this ticket please.","Is this a winner?","Scan this bud.","Can you check my ticket?","Here, can you scan this?","This a winner?"];
  const winR={cash:["Oh nice! Cash me out please.","I won! Give me the cash.","Sweet, cash it out for me."],playAgain:["Won! Put it on another "+g.name+".","Oh cool, play it again — "+g.name+"."]};
  const loseR={leave:["Dang. Oh well, thanks.","Not my day. Bye.","Worth a shot. Thanks."],buyNew:["Nothing? Gimme another "+g.name+" then.","Not a winner? One more please."]};
  return{id:ticketId,gameId:gid,gameName:g.name,gameCol:g.col,nums,bonus,boards,drawDate,isWinner,winAmount,customerWants,presentPhrase:pick(presents),winReaction:isWinner?pick(winR[customerWants]||winR.cash):null,loseReaction:!isWinner?pick(loseR[customerWants]||loseR.leave):null};
}

// ═══ VALIDATE ════════════════════════════════════════════════════════════════
function validate(order,usr){
  const g=GAMES[order.gameId];const errs=[],oks=[];
  const chk=(c,ok,err)=>{if(c)oks.push(ok);else errs.push(err);};
  chk(usr.selectedGame===order.gameId,`✅ Correct game: ${g.name}`,`❌ Game: picked "${GAMES[usr.selectedGame]?.name||'none'}" → should be "${g.name}"`);
  if(order.gameId==='lightning')chk(Number(usr.boards)===order.boards,`✅ Boards: ${order.boards}`,`❌ Boards: ${usr.boards||'—'} → ${order.boards}`);
  else if(order.gameId==='joker'||order.gameId==='cardlotto'){chk(Number(usr.selections)===order.selections,`✅ Selections: ${order.selections}`,`❌ Selections: ${usr.selections||'—'} → ${order.selections}`);chk(usr.addOn===order.addOn,`✅ Add-on: ${order.addOn?'Yes':'No'}`,`❌ Add-on: ${usr.addOn==null?'—':usr.addOn?'Yes':'No'} → ${order.addOn?'Yes':'No'}`);}
  else if(order.gameId==='powerbux'){chk(Number(usr.boards)===order.boards,`✅ Boards: ${order.boards}`,`❌ Boards: ${usr.boards||'—'} → ${order.boards}`);chk(Number(usr.draws)===order.draws,`✅ Draws: ${order.draws}`,`❌ Draws: ${usr.draws||'—'} → ${order.draws}`);}
  else if(order.gameId==='wheelrich'){chk(Number(usr.boards)===order.boards,`✅ Boards: ${order.boards}`,`❌ Boards: ${usr.boards||'—'} → ${order.boards}`);chk(Number(usr.spins)===order.spins,`✅ Spins: ${order.spins}`,`❌ Spins: ${usr.spins||'—'} → ${order.spins}`);}
  else if(['duo','triple','quad'].includes(order.gameId)){chk(usr.playType===order.playType,`✅ Play Type: ${order.playType}`,`❌ Play Type: "${usr.playType||'—'}" → "${order.playType}"`);chk(Number(usr.wager)===order.wager,`✅ Wager: $${order.wager}`,`❌ Wager: $${usr.wager||'—'} → $${order.wager}`);chk(Number(usr.draws)===order.draws,`✅ Draws: ${order.draws}`,`❌ Draws: ${usr.draws||'—'} → ${order.draws}`);}
  else{chk(Number(usr.boards)===order.boards,`✅ Boards: ${order.boards}`,`❌ Boards: ${usr.boards||'—'} → ${order.boards}`);chk(Number(usr.draws)===order.draws,`✅ Draws: ${order.draws}`,`❌ Draws: ${usr.draws||'—'} → ${order.draws}`);chk(Number(usr.encore)===order.encore,`✅ Encore: ${order.encore}`,`❌ Encore: ${usr.encore===null?'—':usr.encore} → ${order.encore}`);if(order.gameId==='g650')chk(usr.addOn===order.addOn,`✅ 6/50 Add-on: ${order.addOn?'Yes':'No'}`,`❌ 6/50 Add-on: ${usr.addOn==null?'—':usr.addOn?'Yes':'No'} → ${order.addOn?'Yes':'No'}`);}
  return{isCorrect:errs.length===0,errs,oks};
}

// ═══ VOICE ENGINE ════════════════════════════════════════════════════════════
const MALE_NAMES=['david','james','daniel','alex','tom','fred','mark','guy','mike','nathan','george','arthur','oliver','harry','bruce','joe','paul','chris','ryan','eric','carlos','ken'];
const FEMALE_NAMES=['samantha','victoria','karen','zira','hazel','moira','allison','susan','linda','lisa','alice','emma','sarah','emily','jessica','maria','anna','kate','julia','claire','grace','ava'];

const loadVoices=()=>new Promise(res=>{
  const v=window.speechSynthesis.getVoices();
  if(v.length){res(v);return;}
  window.speechSynthesis.onvoiceschanged=()=>res(window.speechSynthesis.getVoices());
});

function pickVoice(gender,voices){
  const en=voices.filter(v=>v.lang.startsWith('en'));
  const names=gender==='male'?MALE_NAMES:FEMALE_NAMES;
  // Try name match first
  const named=en.filter(v=>names.some(n=>v.name.toLowerCase().includes(n)));
  if(named.length) return pick(named);
  // Try gender keyword
  const kw=gender==='male'?'male':'female';
  const kwd=en.filter(v=>v.name.toLowerCase().includes(kw));
  if(kwd.length) return pick(kwd);
  // Fallback: split available voices by index
  if(en.length>=2) return gender==='male'?en[0]:en[en.length>2?Math.floor(en.length/2):1];
  return en[0]||voices[0]||null;
}

function speak(text,gender,emotion,onEnd){
  window.speechSynthesis.cancel();
  const em=EMOTIONS[emotion]||EMOTIONS.casual;
  loadVoices().then(voices=>{
    const voice=pickVoice(gender,voices);
    const utt=new SpeechSynthesisUtterance(text);
    if(voice)utt.voice=voice;
    utt.lang=voice?.lang||'en-CA';
    utt.rate=em.rate;
    utt.pitch=gender==='female'?em.pitch*1.1:em.pitch*0.92;
    utt.volume=em.vol;
    utt.onend=onEnd;utt.onerror=onEnd;
    window.speechSynthesis.speak(utt);
  });
}

// ═══ TIMER COMPONENT ═════════════════════════════════════════════════════════
function BigTimer({timeLeft,maxTime,active,done}){
  const pct=Math.max(0,(timeLeft/maxTime)*100);
  const isDanger=timeLeft<=3&&timeLeft>0;
  const isWarn=timeLeft<=Math.ceil(maxTime*.4)&&!isDanger;
  const barCol=isDanger?'#ff2222':isWarn?'#ffaa00':'#00cc44';
  const ringCol=isDanger?'#aa0000':isWarn?'#886600':'#2a4a22';
  const numCol=isDanger?'#ff2222':isWarn?'#ffcc00':active?'#44ff88':'#556eaa';
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
      <div className={`timer-wrap${isDanger?' danger-ring':''}`}
        style={{borderColor:isDanger?'#aa0000':isWarn?'#886600':'#2a3a70',boxShadow:isDanger?'0 0 12px #ff000055':'none'}}>
        <span key={timeLeft} className={isDanger?'danger-num':''}
          style={{fontSize:28,fontWeight:900,color:numCol,display:'inline-block',fontVariantNumeric:'tabular-nums',lineHeight:1}}>
          {done?'✓':timeLeft}
        </span>
        <span style={{fontSize:9,color:'#556eaa',letterSpacing:1,marginTop:2}}>
          {done?'DONE':active?'SEC':'PAUSED'}
        </span>
      </div>
      <div className="timer-bar-wrap" style={{width:80}}>
        <div className="timer-bar-fill" style={{width:`${done?100:pct}%`,background:done?'#00cc44':barCol}}/>
      </div>
    </div>
  );
}

  const [timerActive,setTimerActive]=useState(false);
  const timedOutRef=useRef(false);
  const [score,setScore]=useState(0);
  const [replayCount,setReplayCount]=useState(0);
  const printIdRef=useRef(0);
  const maxTime=DIFF_TIMER[diff]||15;
  const isSessionDone=attempts.length>=SESSION_SIZE;

  // ── Timer ──
  useEffect(()=>{if(!timerActive||timeLeft<=0)return;const id=setTimeout(()=>setTimeLeft(t=>t-1),1000);return()=>clearTimeout(id);},[timerActive,timeLeft]);
  useEffect(()=>{
    if(!timerActive||timeLeft>0||timedOutRef.current)return;
    timedOutRef.current=true;setTimerActive(false);
    window.speechSynthesis.cancel();setIsPlaying(false);
    const att={isCorrect:false,oks:[],errs:['⏰ Time ran out!'],type:scenarioType,timedOut:true,replayCount,score:0,emotion,voiceGender,order:order||{sentence:scanTicket?.presentPhrase||'Ticket scan'},desc:scanTicket?.presentPhrase};
    setAttempts(p=>{const n=[...p,att];setActiveIdx(n.length-1);return n;});
    setResult({isCorrect:false,errs:['⏰ Time ran out!'],oks:[]});setTextRevealed(true);
  },[timerActive,timeLeft,scenarioType,order,scanTicket,replayCount,emotion,voiceGender]);

  const startTimer=useCallback(()=>{timedOutRef.current=false;setTimeLeft(DIFF_TIMER[diff]||15);setTimerActive(true);},[diff]);
  const stopTimer=useCallback(()=>setTimerActive(false),[]);

  const newScenario=useCallback(()=>{
    if(attempts.length>=SESSION_SIZE)return;
    window.speechSynthesis.cancel();setIsPlaying(false);
    const isScan=Math.random()<0.25;
    const gender=Math.random()>.5?'male':'female';
    const emotionPool=EMOTION_POOL[diff]||EMOTION_POOL.easy;
    const em=pick(emotionPool);
    const vm=mode==='random'?Math.random()>.5:mode==='voice';
    setUsr(defaultUsr);setResult(null);setPrintedTickets([]);setHanding(false);setUserScanAction(null);setReplayCount(0);setHasPlayedOnce(false);setVoiceGender(gender);setEmotion(em);
    if(isScan){setScenarioType('scan');setOrder(null);setScanTicket(generateScanTicket());setScanPhase('presenting');setScanning(false);setIsVoice(false);setTextRevealed(true);}
    else{setScenarioType('order');setScanTicket(null);setScanPhase('presenting');const o=generateOrder(diff);setOrder(o);setIsVoice(vm);setTextRevealed(!vm);}
    startTimer();
  },[diff,mode,attempts.length,startTimer]);

  const startGame=useCallback(()=>{setAttempts([]);setScore(0);setActiveIdx(null);setScreen('game');setTimeout(newScenario,50);},[newScenario]);
  const restartGame=useCallback(()=>{setAttempts([]);setScore(0);setActiveIdx(null);setTimeout(newScenario,50);},[newScenario]);

  const handleVoicePlay=useCallback(()=>{
    if(!order)return;
    if(hasPlayedOnce)setReplayCount(r=>r+1);
    setHasPlayedOnce(true);setIsPlaying(true);
    speak(order.sentence,voiceGender,emotion,()=>setIsPlaying(false));
  },[order,voiceGender,emotion,hasPlayedOnce]);

  const handleScan=useCallback(()=>{setScanning(true);setTimeout(()=>{setScanning(false);setScanPhase('revealed');},2000);},[]);

  const recordAttempt=useCallback((isCorrect,oks,errs,type,ord,desc,rc)=>{
    const rawScore=isCorrect?Math.round(BASE_POINTS*Math.pow(.5,rc)):0;
    setScore(s=>s+rawScore);
    const att={isCorrect,oks,errs,type,timedOut:false,replayCount:rc,score:rawScore,emotion,voiceGender,order:ord,desc};
    setAttempts(p=>{const n=[...p,att];setActiveIdx(n.length-1);return n;});
    stopTimer();
  },[stopTimer,emotion,voiceGender]);

  const handleScanDecision=(wants)=>{
    setUserScanAction(wants);
    if(wants==='cash'){recordAttempt(true,['✅ Scanned ticket','✅ Paid out $'+scanTicket.winAmount+'.00'],[],  'scan',{sentence:scanTicket.presentPhrase},scanTicket.presentPhrase,replayCount);setScanPhase('done');setResult({isCorrect:true,oks:[],errs:[]});}
    else if(wants==='leave'){const ok=scanTicket.customerWants==='leave';recordAttempt(ok,ok?['✅ Scanned','✅ Returned ticket']:['✅ Scanned'],ok?[]:['❌ Customer wanted '+scanTicket.customerWants],'scan',{sentence:scanTicket.presentPhrase},scanTicket.presentPhrase,replayCount);setScanPhase('done');setResult({isCorrect:ok,oks:[],errs:[]});}
    else if(wants==='playAgain'||wants==='buyNew'){const o=generateOrder(diff);setOrder(o);setUsr(defaultUsr);setResult(null);setPrintedTickets([]);setScanPhase('playAgain');startTimer();}
  };

  const handleSelectGame=(id)=>{if(result)return;setUsr(p=>({...defaultUsr,selectedGame:id}));};

  const canSubmit=useCallback(()=>{
    if(!usr.selectedGame||result)return false;
    const g=GAMES[usr.selectedGame];if(!g)return false;
    if(g.id==='lightning')return usr.boards!==null;
    if(g.id==='joker'||g.id==='cardlotto')return usr.selections!==null&&usr.addOn!==null;
    if(g.id==='powerbux')return usr.boards!==null&&usr.draws!==null;
    if(g.id==='wheelrich')return usr.boards!==null&&usr.spins!==null;
    if(['duo','triple','quad'].includes(g.id))return usr.playType!==null&&usr.wager!==null&&usr.draws!==null;
    const base=usr.boards!==null&&usr.draws!==null&&usr.encore!==null;
    if(g.id==='g650')return base&&usr.addOn!==null;return base;
  },[usr,result]);

  const handlePrint=useCallback(()=>{
    if(!canSubmit())return;
    const r=validate(order,usr);
    const g=GAMES[order.gameId];
    const ft={...order,gameId:order.gameId,gameName:g.name,gameCol:g.col,nums:Array.from({length:6},()=>rng(1,49)).sort((a,b)=>a-b),bonus:rng(1,20),boards:usr.boards||1,drawDate:new Date().toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}),id:Math.random().toString(36).substr(2,4).toUpperCase()+'-'+Math.random().toString(36).substr(2,4).toUpperCase(),isWinner:false,_printId:++printIdRef.current};
    setPrintedTickets(p=>[...p,ft]);
    if(isVoice)setTextRevealed(true);
    if(scanPhase==='playAgain'){
      const decOk=scanTicket.customerWants==='playAgain'||scanTicket.customerWants==='buyNew';
      const oks=['✅ Scanned ticket',...(decOk?['✅ Correct: play again']:[]),...r.oks];
      const errs=[...(decOk?[]:['❌ Customer wanted '+scanTicket.customerWants]),...r.errs];
      recordAttempt(errs.length===0,oks,errs,'scan',{sentence:scanTicket.presentPhrase},scanTicket.presentPhrase,replayCount);setScanPhase('done');setResult(r);
    } else {recordAttempt(r.isCorrect,r.oks,r.errs,'order',order,null,replayCount);setResult(r);}
  },[canSubmit,order,usr,isVoice,scanPhase,scanTicket,replayCount,recordAttempt]);

  const handleHand=useCallback(()=>{setHanding(true);setTimeout(()=>{setPrintedTickets([]);setHanding(false);},600);},[]);

  if(screen==='settings')return <SettingsScreen diff={diff} setDiff={setDiff} mode={mode} setMode={setMode} onStart={startGame}/>;
  if(isSessionDone)return <SessionComplete attempts={attempts} score={score} diff={diff} onRestart={restartGame} onSettings={()=>setScreen('settings')}/>;

  const currentGame=usr.selectedGame?GAMES[usr.selectedGame]:null;
  const di=DIFF_INFO[diff];
  const correct=attempts.filter(a=>a.isCorrect).length;
  const showTopBar=scenarioType==='order'||scanPhase==='playAgain';

  return(<div style={{minHeight:'100vh',background:'linear-gradient(180deg,#1a3a8c,#0a1845)',display:'flex',flexDirection:'column'}}>
    {showTopBar&&<TopBar selected={usr.selectedGame} onSelect={handleSelectGame}/>}
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 12px',background:'#070e30',borderBottom:'1px solid #1a2a70',flexWrap:'wrap',gap:4}}>
      <span style={{color:'#ffd700',fontWeight:'bold',fontSize:11,letterSpacing:1}}>🎰 LOTTERY TRAINING</span>
      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
        <div style={{background:'rgba(0,0,0,.3)',border:'1px solid #3a5aaa',borderRadius:6,padding:'3px 10px',display:'flex',gap:8,alignItems:'center'}}>
          <span style={{color:'#ffd700',fontWeight:'bold',fontSize:13}}>⭐ {score}</span>
          <span style={{color:correct>=(DIFF_PASS[diff]||10)?'#00ff88':'#ffaa44',fontSize:11}}>✅ {correct}/{SESSION_SIZE} <span style={{color:'#6677aa',fontSize:10}}>need {DIFF_PASS[diff]||10}</span></span>
        </div>
        <span style={{fontSize:10,color:'#6677aa'}}>{di.emoji} {di.label}</span>
        {scenarioType==='scan'&&<span style={{fontSize:10,color:'#00cfff',background:'rgba(0,150,255,.15)',padding:'2px 6px',borderRadius:4,border:'1px solid #00cfff44'}}>🎫 SCAN</span>}
        <button onClick={()=>{window.speechSynthesis.cancel();setScreen('settings');}} style={{fontSize:10,padding:'3px 8px',background:'#1a2a70',border:'1px solid #3a5aaa',borderRadius:4,color:'#8899cc',cursor:'pointer'}}>⚙</button>
      </div>
    </div>

    <div className="main-flex" style={{display:'flex',flex:1,gap:10,padding:10,alignItems:'flex-start'}}>
      {/* LEFT */}
      <div style={{flex:'1 1 250px',display:'flex',flexDirection:'column',gap:10,minWidth:220}}>
        <div style={{background:'rgba(8,20,70,.85)',border:'2px solid #3a5aaa',borderRadius:8,padding:14}}>
          <div style={{display:'flex',gap:12,alignItems:'flex-start',marginBottom:10}}>
            <div style={{flex:1}}>
              <div style={{color:'#ffd700',fontWeight:'bold',fontSize:11,letterSpacing:1,marginBottom:4}}>👤 CUSTOMER</div>
              {isVoice&&!result&&<div style={{fontSize:10,color:'#8899cc',marginBottom:4}}>🎭 {EMOTIONS[emotion]?.label||emotion} · {voiceGender==='female'?'👩 F':'👨 M'}</div>}
            </div>
            {/* BIG TIMER */}
            <BigTimer timeLeft={timeLeft} maxTime={maxTime} active={timerActive&&!result} done={!!result}/>
          </div>

          {/* Speech bubble */}
          <div style={{background:'rgba(0,0,0,.3)',borderRadius:6,padding:10,marginBottom:10,border:'1px solid #2a40aa'}}>
            {scenarioType==='scan'?(
              <span style={{fontSize:13,color:'white',fontStyle:'italic'}}>"{scanTicket?.presentPhrase}"</span>
            ):isVoice?(
              <div>
                <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:8}}>
                  <button className="act-btn" style={{background:isPlaying?'#004466':'#004488',borderColor:'#0088ff',color:'white',padding:'6px 12px',fontSize:12}} onClick={handleVoicePlay} disabled={isPlaying}>
                    {isPlaying?'🔊...':'▶ Play'}
                  </button>
                  {isPlaying&&<button className="act-btn" style={{background:'#440000',borderColor:'#bb0000',color:'white',padding:'6px 10px',fontSize:12}} onClick={()=>{window.speechSynthesis.cancel();setIsPlaying(false);}}>⏹</button>}
                  {replayCount>0&&<span style={{color:'#ffaa44',fontSize:10,background:'rgba(255,170,0,.12)',padding:'2px 6px',borderRadius:4,border:'1px solid #ffaa4433'}}>🔁×{replayCount} -{Math.round((1-Math.pow(.5,replayCount))*100)}%</span>}
                </div>
                <div className={!result&&!textRevealed?'blurred':''}>
                  <span style={{fontSize:13,color:'white',fontStyle:'italic'}}>"{order?.sentence}"</span>
                </div>
              </div>
            ):(
              <span style={{fontSize:13,color:'white',lineHeight:1.5,fontStyle:'italic'}}>"{order?.sentence}"</span>
            )}
          </div>

          {scenarioType==='scan'&&scanTicket&&<div style={{display:'flex',justifyContent:'center',marginBottom:10}}><TicketCard ticket={scanTicket} revealed={['revealed','deciding','playAgain','done'].includes(scanPhase)} mini={false}/></div>}
          {scanPhase==='revealed'&&(scanTicket?.winReaction||scanTicket?.loseReaction)&&<div style={{background:'rgba(0,0,0,.3)',borderRadius:6,padding:8,marginBottom:8,border:'1px solid #3a5aaa'}}><div style={{color:'#aab0cc',fontSize:10,marginBottom:2}}>Customer reacts:</div><span style={{fontSize:13,color:scanTicket?.isWinner?'#88ff88':'#ffaa88',fontStyle:'italic'}}>"{scanTicket.isWinner?scanTicket.winReaction:scanTicket.loseReaction}"</span></div>}
          {scanPhase==='playAgain'&&scanTicket?.isWinner&&<div style={{background:'rgba(0,100,0,.3)',border:'1px solid #00aa00',borderRadius:6,padding:8,marginBottom:8}}><div style={{color:'#88ff88',fontWeight:'bold',fontSize:12}}>💰 Budget: ${scanTicket.winAmount}.00</div><div style={{color:'#aab0cc',fontSize:10}}>Enter new order below</div></div>}
          {result&&<div style={{background:result.isCorrect?'rgba(0,80,0,.4)':'rgba(100,0,0,.4)',borderRadius:6,padding:8,marginBottom:8,border:`1px solid ${result.isCorrect?'#00cc00':'#cc0000'}`}}><div style={{fontWeight:'bold',fontSize:12,color:result.isCorrect?'#00ff66':'#ff5555'}}>{result.isCorrect?'✅ CORRECT!':'❌ INCORRECT'}</div></div>}
          <button className="act-btn" style={{background:'#005500',borderColor:'#00aa00',color:'white',width:'100%'}} onClick={newScenario} disabled={isSessionDone}>🔄 Next Scenario</button>
        </div>
        <AttemptsPanel attempts={attempts} activeIdx={activeIdx} setActiveIdx={setActiveIdx}/>
      </div>

      {/* RIGHT */}
      <div style={{flex:'2 1 360px',display:'flex',flexDirection:'column',gap:10}}>
        {(scenarioType==='scan'&&(scanPhase==='presenting'||scanPhase==='revealed'))&&<ScanPanel scanPhase={scanPhase} onScan={handleScan} scanning={scanning}/>}
        {scanPhase==='revealed'&&<div style={{background:'rgba(8,20,70,.7)',border:'2px solid #3a5aaa',borderRadius:8,padding:14}}>
          <div style={{color:'#ffd700',fontWeight:'bold',fontSize:11,marginBottom:10,letterSpacing:1}}>WHAT DOES THE CUSTOMER WANT?</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {scanTicket?.isWinner&&<><button className="act-btn" style={{background:'#005500',borderColor:'#00aa00',color:'white'}} onClick={()=>handleScanDecision('cash')}>💵 Pay Out ${scanTicket.winAmount}</button><button className="act-btn" style={{background:'#004488',borderColor:'#0088ff',color:'white'}} onClick={()=>handleScanDecision('playAgain')}>🎫 Play Again</button></>}
            {!scanTicket?.isWinner&&<><button className="act-btn" style={{background:'#004488',borderColor:'#0088ff',color:'white'}} onClick={()=>handleScanDecision('buyNew')}>🎫 Buy New Ticket</button><button className="act-btn" style={{background:'#444',borderColor:'#888',color:'white'}} onClick={()=>handleScanDecision('leave')}>↩ Return / Done</button></>}
          </div>
        </div>}
        {(scenarioType==='order'||scanPhase==='playAgain')&&<div>
          {scanPhase==='playAgain'&&<div style={{background:'rgba(0,80,0,.2)',border:'1px solid #00aa00',borderRadius:6,padding:'6px 12px',marginBottom:8,fontSize:11,color:'#88ff88'}}>🔄 PLAY AGAIN — Enter the new order</div>}
          <GameScreen game={currentGame} usr={usr} setUsr={setUsr} locked={!!result}/>
        </div>}
        {printedTickets.length>0&&<PrintDeck tickets={printedTickets} onHand={handleHand} handing={handing}/>}
        {(scenarioType==='order'||scanPhase==='playAgain')&&<div style={{display:'flex',gap:10,alignItems:'center',background:'rgba(8,20,70,.7)',border:'2px solid #3a5aaa',borderRadius:8,padding:'9px 13px'}}>
          <div style={{flex:1}}><div style={{color:'#7788bb',fontSize:10}}>Customer Total</div><div style={{color:'#ffd700',fontSize:17,fontWeight:'bold'}}>$0.00</div></div>
          <button className="act-btn" style={{background:'#440000',borderColor:'#aa0000',color:'white'}} onClick={newScenario}>Cancel</button>
          <button className="act-btn" style={{background:canSubmit()?'#004400':'#1a1a1a',borderColor:canSubmit()?'#008800':'#333',color:canSubmit()?'white':'#555',cursor:canSubmit()?'pointer':'not-allowed'}} onClick={handlePrint} disabled={!canSubmit()}>🎫 Print Ticket</button>
        </div>}
      </div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
