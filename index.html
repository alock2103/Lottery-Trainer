<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lottery Training Simulator</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a1845;font-family:Arial,sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0a1845}::-webkit-scrollbar-thumb{background:#3a6cc0;border-radius:3px}
.num-btn{display:flex;align-items:center;justify-content:center;width:50px;height:34px;border:2px solid #556eaa;background:#162566;color:#dde;font-size:14px;font-weight:bold;cursor:pointer;border-radius:4px;transition:all .1s;user-select:none}
.num-btn:hover{background:#1e3580;border-color:#ffd700}
.num-btn.sel{background:#b30000;border-color:#ff5555;color:#fff}
.game-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 6px;border:2px solid #3a55aa;background:#162566;cursor:pointer;border-radius:4px;min-width:60px;min-height:42px;transition:all .15s;user-select:none}
.game-tab:hover{border-color:#ffd700;background:#1e3580}
.game-tab.act{border-color:#ffd700;background:#1e3880;box-shadow:0 0 8px #ffd70066}
.chip-btn{padding:6px 14px;border-radius:4px;font-weight:bold;font-size:13px;cursor:pointer;border:2px solid;transition:all .15s;user-select:none}
.chip-btn.sel{background:#b30000;border-color:#ff5555;color:#fff}
.chip-btn:not(.sel){background:#162566;border-color:#556eaa;color:#ccd}
.chip-btn:hover:not(.sel){border-color:#ffd700}
.act-btn{padding:9px 18px;border-radius:6px;font-weight:bold;font-size:13px;cursor:pointer;border:2px solid;transition:all .15s;user-select:none}
.circ{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;cursor:pointer;border:2px solid rgba(255,255,255,.4);transition:transform .1s;flex-shrink:0}
.circ:hover{transform:scale(1.12)}
.col-lbl{color:#ffd700;font-size:10px;font-weight:bold;text-align:center;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.diff-btn{padding:7px 14px;border-radius:6px;font-weight:bold;font-size:12px;cursor:pointer;border:2px solid;transition:all .15s;user-select:none;text-align:center}
.mode-btn{padding:6px 12px;border-radius:5px;font-weight:bold;font-size:12px;cursor:pointer;border:2px solid;transition:all .15s;user-select:none}
.blurred{filter:blur(8px);user-select:none;pointer-events:none}
.voice-wave{display:flex;gap:3px;align-items:flex-end;height:30px}
.voice-wave span{width:4px;background:#00cfff;border-radius:2px;animation:wave .8s infinite ease-in-out}
.voice-wave span:nth-child(2){animation-delay:.1s}.voice-wave span:nth-child(3){animation-delay:.2s}
.voice-wave span:nth-child(4){animation-delay:.3s}.voice-wave span:nth-child(5){animation-delay:.4s}
@keyframes wave{0%,100%{height:6px}50%{height:24px}}
.ticket-card{background:#fff;border-radius:8px;padding:10px;color:#111;font-family:'Courier New',monospace;font-size:11px;border:1px solid #ccc;box-shadow:2px 3px 8px rgba(0,0,0,.4);position:relative;overflow:hidden;width:170px;min-height:200px;flex-shrink:0}
.ticket-result-banner{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:14px;font-weight:900;z-index:10;border-radius:8px}
.barcode-lines{display:flex;gap:1px;height:22px;align-items:flex-end;overflow:hidden;margin:4px 0}
.deck-wrap{position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:80px;padding:10px 30px}
.fanned{position:absolute;transition:transform .3s}
@keyframes handoff{0%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(-200px)}}
.handing{animation:handoff .5s forwards}
@keyframes scanpulse{0%,100%{border-color:#3a55aa}50%{border-color:#00cfff;box-shadow:0 0 16px #00cfff88}}
.scanning-anim{animation:scanpulse .4s ease-in-out 4}
@media(max-width:620px){.main-flex{flex-direction:column!important}}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

// ═══ GAME CONFIG ══════════════════════════════════════════════════════════════
const GAMES={
  macks:{id:'macks',name:'Lotto Macks',sub:'(Lotto Max)',sn:'LOTTO\nMACKS',col:'#ffcc00',params:['boards','draws','encore'],bMax:10,dMax:10,eMax:10},
  g650:{id:'g650',name:'Lotto 6/50',sub:'(Lotto 6/49)',sn:'LOTTO\n6/50',col:'#ffd700',params:['boards','draws','encore','addOn'],bMax:10,dMax:10,eMax:10,aoLabel:'Play 6/50 Add-on?'},
  ont50:{id:'ont50',name:"L'Ontario 50",sub:'(Ontario 49)',sn:"L'ONT\n50",col:'#ff8800',params:['boards','draws','encore'],bMax:10,dMax:10,eMax:10},
  lightning:{id:'lightning',name:'Lightning Lotts',sub:'(Lightning Lotto)',sn:'LTNG\nLOTTS',col:'#00cfff',params:['boards'],bMax:5},
  joker:{id:'joker',name:'Joker Lotto',sub:'(Poker Lotto)',sn:'JOKER\nLOTTO',col:'#dd44dd',params:['selections','addOn'],sMax:3,aoLabel:'Play Joker Lotto?'},
  powerbux:{id:'powerbux',name:'Power Bux',sub:'(Power Bucks)',sn:'POWER\nBUX',col:'#44ddaa',params:['boards','draws'],bMax:10,dMax:10},
  wheelrich:{id:'wheelrich',name:'Wheel of Riches',sub:'(Wheel of Fortune)',sn:'WHEEL\nRICHES',col:'#ff6644',params:['boards','spins'],bMax:5,spinMax:5},
  cardlotto:{id:'cardlotto',name:'Card Lotto',sub:'(Poker variant)',sn:'CARD\nLOTTO',col:'#88aaff',params:['selections','addOn'],sMax:5,aoLabel:'Play Card Add-on?'},
  duo:{id:'duo',name:'Duo Pick',sub:'(Pick 2)',sn:'DUO\nPICK',col:'#aaffaa',params:['playType','wager','draws'],playTypes:['Straight','Straight/Box'],wagers:[0.5,1,2],dMax:7},
  triple:{id:'triple',name:'Triple Pick',sub:'(Pick 3)',sn:'TRIPLE\nPICK',col:'#ffaacc',params:['playType','wager','draws'],playTypes:['Straight','Box','S+B','Combo'],wagers:[0.5,1,2],dMax:7},
  quad:{id:'quad',name:'Quad Pick',sub:'(Pick 4)',sn:'QUAD\nPICK',col:'#ccaaff',params:['playType','wager','draws'],playTypes:['Straight','Box','S+B','Combo','Front Pair','Back Pair'],wagers:[0.5,1],dMax:7},
};
const DIFF_INFO={
  easy:{label:'Easy',emoji:'🟢',desc:'Clear standard English'},
  medium:{label:'Medium',emoji:'🟡',desc:'Casual with some slang'},
  hard:{label:'Hard',emoji:'🔴',desc:'Heavy slang, curses, twists'},
  insane:{label:'Ich Will Sterben',emoji:'💀',desc:'Pure chaos. God help you.'},
};
const rng=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

// ═══ SENTENCE BUILDERS (unchanged from v2) ════════════════════════════════════
const numWord=(n,diff)=>{
  if(diff==='easy') return String(n);
  const med={0:'zero',1:'one',2:'two',3:'three',4:'four',5:'five',6:'six',7:'seven',8:'eight',9:'nine',10:'ten'};
  if(diff==='medium') return pick([String(n),med[n]||String(n)]);
  const sl={0:['zero','zilch','zip'],1:['one','uno','a single'],2:['two','a couple','a deuce'],3:['three','a trey','a few'],4:['four','a quad'],5:['five','a fiver'],6:['six','half a dozen'],7:['seven'],8:['eight'],9:['nine'],10:['ten','a tenner']};
  return pick(sl[n]||[String(n)]);
};
const gameName=(gid,diff)=>{
  const g=GAMES[gid];
  if(diff==='easy'||diff==='medium') return g.name;
  const nk={macks:['the Macks','the big one','that Max thing'],g650:['six-fifty','that number game','the six-forty-nine'],ont50:["the Ontario one","l'Ontario fifty"],lightning:['the lightning one','the quick one'],joker:['the joker thing','the card poker one'],powerbux:['the power one','power bux'],wheelrich:['the wheel one','that spinner game'],cardlotto:['card lotto','the other card one'],duo:['pick two','the double'],triple:['pick three','triple pick'],quad:['pick four','quad pick']};
  return pick(nk[gid]||[g.name]);
};
const encorePhrase=(n,diff)=>{
  if(n===0){if(diff==='easy')return 'no encore';if(diff==='medium')return pick(['no encore','skip the encore']);return pick(['no encore','skip the extras','forget the encore']);}
  if(diff==='easy')return `${n} encore`;
  if(diff==='medium')return pick([`${n} encore`,`${numWord(n,diff)} encore`]);
  return pick([`${numWord(n,diff)} encore`,`throw in ${numWord(n,diff)} encore`]);
};
const OPENERS={easy:['Can I get','Please give me','I would like','Give me'],medium:['Yeah gimme','Can I get','Lemme get','Give me'],hard:['Yo gimme','Oi bud gimme','Heyyy can I get','Bud I want'],insane:['Oh for the love of—gimme','So uh... right, I want','Jesus okay so','OKAY so listen']};
function buildSentence(o,g,diff){
  const op=pick(OPENERS[diff]||OPENERS.easy);
  const bw=o.boards>1?'boards':'board';const dw=o.draws>1?'draws':'draw';
  const gn=gameName(g.id,diff);
  if(diff==='insane'){
    const wb=o.boards===1?2:o.boards-1;const wd=o.draws===1?2:o.draws-1;
    const cr=pick(['wait no','actually','hold on','scratch that']);
    if(['duo','triple','quad'].includes(g.id)){
      const wp=pick(g.playTypes.filter(t=>t!==o.playType)||g.playTypes);
      const wl=o.wager===.5?'fifty cents':o.wager===1?'a loonie':'a toonie';
      return cap(`${op} ${gn}, ${wp.toLowerCase()} play—${cr} ${o.playType.toLowerCase()}, ${wl}, ${numWord(wd,diff)} ${dw}—${cr} ${numWord(o.draws,diff)} ${dw}. Final answer.`);
    }
    if(g.id==='lightning') return cap(`${op} ${gn}... ${numWord(wb,diff)} ${bw}... ${cr} ${numWord(o.boards,diff)}. Yeah.`);
    let s=`${op} ${gn}, ${numWord(wb,diff)} ${bw}—${cr} ${numWord(o.boards,diff)} ${bw}, run it ${numWord(wd,diff)} times—${cr} ${numWord(o.draws,diff)}, ${encorePhrase(o.encore,diff)}`;
    if(g.id==='g650') s+=o.addOn?', and—yes—add the six-fifty':' no six-fifty';
    return cap(s+'. I think. Yeah.');
  }
  if(g.id==='lightning') return cap(`${op} ${gn}, ${numWord(o.boards,diff)} ${bw}.`);
  if(g.id==='joker'||g.id==='cardlotto') return cap(`${op} ${gn}, ${numWord(o.selections,diff)} selection${o.selections>1?'s':''}, ${o.addOn?'yes to the add-on':'no add-on'}.`);
  if(g.id==='powerbux') return cap(`${op} ${gn}, ${numWord(o.boards,diff)} ${bw}, ${numWord(o.draws,diff)} ${dw}.`);
  if(g.id==='wheelrich') return cap(`${op} ${gn}, ${numWord(o.boards,diff)} ${bw}, ${numWord(o.spins,diff)} spin${o.spins>1?'s':''}.`);
  if(['duo','triple','quad'].includes(g.id)){const wl=o.wager===.5?diff==='easy'?'fifty cents':'fitty cents':o.wager===1?diff==='easy'?'one dollar':'a loonie':'two dollars';return cap(`${op} ${gn}, ${o.playType.toLowerCase()} play, ${wl}, ${numWord(o.draws,diff)} ${dw}.`);}
  let s=`${op} ${gn}, ${numWord(o.boards,diff)} ${bw}, ${numWord(o.draws,diff)} ${dw}, ${encorePhrase(o.encore,diff)}`;
  if(g.id==='g650') s+=o.addOn?diff==='easy'?', yes to the 6/50 add-on':', toss in the six-fifty':' no six-fifty';
  return cap(s+'.');
}
function generateOrder(diff){
  const pool=['macks','macks','macks','g650','g650','g650','ont50','ont50','ont50','lightning','lightning','joker','joker','powerbux','wheelrich','cardlotto','duo','triple','quad'];
  const gid=pick(pool);const g=GAMES[gid];const o={gameId:gid,diff};
  if(gid==='lightning'){o.boards=rng(1,5);}
  else if(gid==='joker'){o.selections=rng(1,3);o.addOn=Math.random()>.4;}
  else if(gid==='powerbux'){o.boards=rng(1,10);o.draws=rng(1,10);}
  else if(gid==='wheelrich'){o.boards=rng(1,5);o.spins=rng(1,5);}
  else if(gid==='cardlotto'){o.selections=rng(1,5);o.addOn=Math.random()>.4;}
  else if(['duo','triple','quad'].includes(gid)){o.playType=pick(g.playTypes);o.wager=pick(g.wagers);o.draws=rng(1,7);}
  else{o.boards=rng(1,5);o.draws=rng(1,5);o.encore=Math.random()>.5?rng(1,3):0;if(gid==='g650')o.addOn=Math.random()>.5;}
  o.sentence=buildSentence(o,g,diff);
  return o;
}

// ═══ SCAN TICKET GENERATOR ════════════════════════════════════════════════════
function generateScanTicket(){
  const scannable=['macks','g650','ont50','lightning','powerbux','wheelrich'];
  const gid=pick(scannable);const g=GAMES[gid];
  const isWinner=Math.random()<0.35;
  const winPool=[2,5,5,10,10,10,20,20,50,100,500];
  const winAmount=isWinner?pick(winPool):0;
  const numCount=6;const maxN=gid==='macks'?50:49;
  const nums=[];while(nums.length<numCount){const n=rng(1,maxN);if(!nums.includes(n))nums.push(n);}nums.sort((a,b)=>a-b);
  const bonus=rng(1,20);
  const boards=rng(1,3);
  const days=rng(0,6);
  const d=new Date(Date.now()-days*86400000);
  const drawDate=d.toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'});
  const ticketId=Math.random().toString(36).substr(2,4).toUpperCase()+'-'+Math.random().toString(36).substr(2,4).toUpperCase();
  let customerWants;
  if(isWinner) customerWants=winAmount>=50?pick(['cash','cash','playAgain']):pick(['cash','playAgain','playAgain']);
  else customerWants=pick(['buyNew','leave','leave']);
  const presentPhrases=["Can you scan this for me?","Check this ticket please.","Is this a winner?","Scan this bud.","Can you check my ticket?","Here, can you scan this?"];
  const winReactions={cash:["Oh nice! Cash me out please.","I won! Give me the cash.","Sweet, I'll take the money.","Cash it out for me thanks."],playAgain:["I won! Use it to play again — give me "+g.name+".","Oh cool, put it on another "+g.name+" ticket.","I won! Play it again on "+g.name+" please."]};
  const loseReactions={leave:["Dang. Oh well, thanks.","Not my day. See ya.","Worth a shot. Bye.","Nope. Thanks anyway."],buyNew:["Nothing? Gimme another "+g.name+" then.","Let me try one more "+g.name+".","Not a winner? One more please."]};
  return{id:ticketId,gameId:gid,gameName:g.name,gameCol:g.col,nums,bonus,boards,drawDate,isWinner,winAmount,customerWants,presentPhrase:pick(presentPhrases),winReaction:isWinner?pick(winReactions[customerWants]||winReactions.cash):null,loseReaction:!isWinner?pick(loseReactions[customerWants]||loseReactions.leave):null};
}

// ═══ VALIDATE ORDER ═══════════════════════════════════════════════════════════
function validate(order,usr){
  const g=GAMES[order.gameId];const errs=[],oks=[];
  const chk=(c,ok,err)=>{if(c)oks.push(ok);else errs.push(err);};
  chk(usr.selectedGame===order.gameId,`✅ Correct game: ${g.name}`,`❌ Game: picked "${GAMES[usr.selectedGame]?.name||'none'}" → should be "${g.name}"`);
  if(order.gameId==='lightning') chk(Number(usr.boards)===order.boards,`✅ Boards: ${order.boards}`,`❌ Boards: ${usr.boards||'—'} → should be ${order.boards}`);
  else if(order.gameId==='joker'||order.gameId==='cardlotto'){chk(Number(usr.selections)===order.selections,`✅ Selections: ${order.selections}`,`❌ Selections: ${usr.selections||'—'} → ${order.selections}`);chk(usr.addOn===order.addOn,`✅ Add-on: ${order.addOn?'Yes':'No'}`,`❌ Add-on: ${usr.addOn==null?'—':usr.addOn?'Yes':'No'} → ${order.addOn?'Yes':'No'}`);}
  else if(order.gameId==='powerbux'){chk(Number(usr.boards)===order.boards,`✅ Boards: ${order.boards}`,`❌ Boards: ${usr.boards||'—'} → ${order.boards}`);chk(Number(usr.draws)===order.draws,`✅ Draws: ${order.draws}`,`❌ Draws: ${usr.draws||'—'} → ${order.draws}`);}
  else if(order.gameId==='wheelrich'){chk(Number(usr.boards)===order.boards,`✅ Boards: ${order.boards}`,`❌ Boards: ${usr.boards||'—'} → ${order.boards}`);chk(Number(usr.spins)===order.spins,`✅ Spins: ${order.spins}`,`❌ Spins: ${usr.spins||'—'} → ${order.spins}`);}
  else if(['duo','triple','quad'].includes(order.gameId)){chk(usr.playType===order.playType,`✅ Play Type: ${order.playType}`,`❌ Play Type: "${usr.playType||'—'}" → "${order.playType}"`);chk(Number(usr.wager)===order.wager,`✅ Wager: $${order.wager}`,`❌ Wager: $${usr.wager||'—'} → $${order.wager}`);chk(Number(usr.draws)===order.draws,`✅ Draws: ${order.draws}`,`❌ Draws: ${usr.draws||'—'} → ${order.draws}`);}
  else{chk(Number(usr.boards)===order.boards,`✅ Boards: ${order.boards}`,`❌ Boards: ${usr.boards||'—'} → ${order.boards}`);chk(Number(usr.draws)===order.draws,`✅ Draws: ${order.draws}`,`❌ Draws: ${usr.draws||'—'} → ${order.draws}`);chk(Number(usr.encore)===order.encore,`✅ Encore: ${order.encore}`,`❌ Encore: ${usr.encore===null?'—':usr.encore} → ${order.encore}`);if(order.gameId==='g650')chk(usr.addOn===order.addOn,`✅ 6/50 Add-on: ${order.addOn?'Yes':'No'}`,`❌ 6/50 Add-on: ${usr.addOn==null?'—':usr.addOn?'Yes':'No'} → ${order.addOn?'Yes':'No'}`);}
  return{isCorrect:errs.length===0,errs,oks};
}

// ═══ VOICE ════════════════════════════════════════════════════════════════════
const loadVoices=()=>new Promise(res=>{const v=window.speechSynthesis.getVoices();if(v.length){res(v);return;}window.speechSynthesis.onvoiceschanged=()=>res(window.speechSynthesis.getVoices());});
function pickVoice(gender,voices){const mk=['male','Male','David','david','James','james','Daniel','daniel','Alex','alex','Tom','tom'];const fk=['female','Female','Samantha','samantha','Victoria','victoria','Karen','karen','Zira','zira'];const en=voices.filter(v=>v.lang.startsWith('en'));const kws=gender==='male'?mk:fk;const pool=en.filter(v=>kws.some(k=>v.name.includes(k)));if(pool.length)return pick(pool);return en.length>1?(gender==='male'?en[0]:en[1]):en[0]||voices[0]||null;}
function speak(text,gender,diff,onEnd){window.speechSynthesis.cancel();loadVoices().then(voices=>{const voice=pickVoice(gender,voices);const utt=new SpeechSynthesisUtterance(text);if(voice)utt.voice=voice;utt.lang='en-CA';utt.rate=diff==='easy'?.82:diff==='medium'?.88:diff==='hard'?.95:pick([1.0,1.08]);utt.pitch=gender==='female'?1.15:.85;utt.onend=onEnd;utt.onerror=onEnd;window.speechSynthesis.speak(utt);});}

// ═══ TICKET CARD VISUAL ═══════════════════════════════════════════════════════
function Barcode(){
  const bars=Array.from({length:40},()=>({w:rng(1,3),h:rng(60,100)}));
  return(<div className="barcode-lines">{bars.map((b,i)=><div key={i} style={{width:b.w,height:`${b.h}%`,background:'#111',flexShrink:0}}/>)}</div>);
}
function TicketCard({ticket,revealed,mini}){
  const g=GAMES[ticket.gameId];
  const sz=mini?{width:100,fontSize:8,padding:6}:{width:170,fontSize:11,padding:10};
  return(
    <div className="ticket-card" style={{...sz,minHeight:mini?120:200}}>
      <div style={{background:g.col,color:'#111',fontWeight:900,fontSize:mini?9:12,padding:'4px 6px',margin:`-${sz.padding}px -${sz.padding}px ${sz.padding}px`,letterSpacing:1}}>
        {ticket.gameName.toUpperCase()}
      </div>
      <div style={{color:'#555',fontSize:mini?7:9,marginBottom:4}}>{ticket.drawDate} • {ticket.boards} Board{ticket.boards>1?'s':''}</div>
      <div style={{display:'flex',flexWrap:'wrap',gap:3,marginBottom:4}}>
        {ticket.nums.map((n,i)=>(
          <div key={i} style={{background:'#1a3a8c',color:'white',borderRadius:'50%',width:mini?14:20,height:mini?14:20,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'bold',fontSize:mini?7:10}}>
            {String(n).padStart(2,'0')}
          </div>
        ))}
      </div>
      {!mini&&<div style={{color:'#555',fontSize:9,marginBottom:4}}>BONUS: {String(ticket.bonus).padStart(2,'0')}</div>}
      {!mini&&<Barcode/>}
      <div style={{color:'#888',fontSize:mini?6:8,textAlign:'center'}}>{ticket.id}</div>
      {revealed&&(
        <div className="ticket-result-banner" style={{background:ticket.isWinner?'rgba(0,150,0,.92)':'rgba(160,0,0,.92)',color:'white'}}>
          {ticket.isWinner?<>🎉<div style={{fontSize:16,fontWeight:900}}>WINNER!</div><div style={{fontSize:18}}>${ticket.winAmount}.00</div></>:<><div style={{fontSize:14,fontWeight:900}}>❌ NOT A</div><div style={{fontSize:14,fontWeight:900}}>WINNER</div></>}
        </div>
      )}
    </div>
  );
}

// ═══ PRINT DECK ═══════════════════════════════════════════════════════════════
function PrintDeck({tickets,onHand,handing}){
  if(!tickets.length) return null;
  const angles=[-10,-5,0,5,10,14,-14];
  const offsets=[-22,-11,0,11,22,28,-28];
  return(
    <div style={{background:'rgba(8,20,70,.7)',border:'2px solid #3a5aaa',borderRadius:8,padding:'10px 14px'}}>
      <div style={{color:'#ffd700',fontWeight:'bold',fontSize:11,marginBottom:8,letterSpacing:1}}>
        PRINT TRAY — {tickets.length} TICKET{tickets.length>1?'S':''}
      </div>

cted={usr.draws} onSelect={v=>S('draws',v)} disabled={D}/><NumCol label="# Encore" values={r2(0,10)} selected={usr.encore} onSelect={v=>S('encore',v)} disabled={D}/>{game.id==='g650'&&<YesNoRow label="Play 6/50 Add-on?" value={usr.addOn} onChange={v=>S('addOn',v)} disabled={D}/>}</> }</div></div>);

// ═══ APP ══════════════════════════════════════════════════════════════════════
const defaultUsr={selectedGame:null,boards:null,draws:null,encore:null,selections:null,spins:null,addOn:null,playType:null,wager:null};

function App(){
  const [screen,setScreen]=useState('settings');
  const [diff,setDiff]=useState('easy');
  const [mode,setMode]=useState('text');
  // Scenario state
  const [scenarioType,setScenarioType]=useState('order'); // 'order'|'scan'
  const [order,setOrder]=useState(null);
  const [scanTicket,setScanTicket]=useState(null);
  const [scanPhase,setScanPhase]=useState('presenting'); // presenting|revealed|deciding|playAgain|done
  const [scanning,setScanning]=useState(false);
  // Order/usr state (used for both regular orders AND play-again sub-flow)
  const [usr,setUsr]=useState(defaultUsr);
  const [result,setResult]=useState(null);
  const [printedTickets,setPrintedTickets]=useState([]);
  const [handing,setHanding]=useState(false);
  const [ticketsDone,setTicketsDone]=useState(false);
  // Scan action state
  const [userScanAction,setUserScanAction]=useState(null);
  // Attempts
  const [attempts,setAttempts]=useState([]);
  const [activeIdx,setActiveIdx]=useState(null);
  // Voice
  const [isVoice,setIsVoice]=useState(false);
  const [isPlaying,setIsPlaying]=useState(false);
  const [voiceGender,setVoiceGender]=useState('male');
  const [textRevealed,setTextRevealed]=useState(false);
  // Scenario done flag
  const [scenarioDone,setScenarioDone]=useState(false);

  const printIdRef=useRef(0);

  const newScenario=useCallback(()=>{
    window.speechSynthesis.cancel();setIsPlaying(false);
    const isScan=Math.random()<0.25;
    const gender=Math.random()>.5?'male':'female';
    const vm=mode==='random'?Math.random()>.5:mode==='voice';
    setUsr(defaultUsr);setResult(null);setPrintedTickets([]);setHanding(false);setTicketsDone(false);setUserScanAction(null);setScenarioDone(false);
    if(isScan){
      setScenarioType('scan');setOrder(null);
      setScanTicket(generateScanTicket());setScanPhase('presenting');setScanning(false);
      setIsVoice(false);setTextRevealed(true);
    } else {
      setScenarioType('order');setScanTicket(null);setScanPhase('presenting');
      const o=generateOrder(diff);setOrder(o);
      setIsVoice(vm);setVoiceGender(gender);setTextRevealed(!vm);
    }
  },[diff,mode]);

  const startGame=useCallback(()=>{setScreen('game');newScenario();},[newScenario]);

  // Scan ticket
  const handleScan=useCallback(()=>{
    setScanning(true);
    setTimeout(()=>{setScanning(false);setScanPhase('revealed');},2000);
  },[]);

  // Customer decision for scan scenarios
  const handleScanDecision=(wants)=>{
    setUserScanAction(wants);
    if(wants==='cash'){
      // Graded immediately
      const oks=['✅ Scanned ticket correctly','✅ Paid out cash to customer: $'+scanTicket.winAmount+'.00'];
      const errs=[];
      const att={isCorrect:true,oks,errs,type:'scan',desc:scanTicket.presentPhrase,order:{sentence:scanTicket.presentPhrase}};
      setAttempts(p=>{const n=[...p,att];setActiveIdx(n.length-1);return n;});
      setScanPhase('done');setScenarioDone(true);
    } else if(wants==='leave'){
      const oks=['✅ Scanned ticket correctly','✅ Returned ticket to customer'];
      const att={isCorrect:true,oks,errs:[],type:'scan',desc:scanTicket.presentPhrase,order:{sentence:scanTicket.presentPhrase}};
      setAttempts(p=>{const n=[...p,att];setActiveIdx(n.length-1);return n;});
      setScanPhase('done');setScenarioDone(true);
    } else if(wants==='playAgain'||wants==='buyNew'){
      // Generate a new order for play-again flow
      const o=generateOrder(diff);setOrder(o);setUsr(defaultUsr);setResult(null);setPrintedTickets([]);
      setScanPhase('playAgain');
    }
  };

  // Check if customer decision matches what was expected
  const getScanDecisionCorrectness=(action,ticket)=>{
    if(ticket.customerWants==='cash') return action==='cash';
    if(ticket.customerWants==='leave') return action==='leave';
    if(ticket.customerWants==='playAgain'||ticket.customerWants==='buyNew') return action==='playAgain'||action==='buyNew';
    return false;
  };

  const handleSelectGame=(id)=>{if(result) return;setUsr(p=>({...defaultUsr,selectedGame:id}));};

  const canSubmit=useCallback(()=>{
    if(!usr.selectedGame||result) return false;
    const g=GAMES[usr.selectedGame];if(!g)return false;
    if(g.id==='lightning') return usr.boards!==null;
    if(g.id==='joker'||g.id==='cardlotto') return usr.selections!==null&&usr.addOn!==null;
    if(g.id==='powerbux') return usr.boards!==null&&usr.draws!==null;
    if(g.id==='wheelrich') return usr.boards!==null&&usr.spins!==null;
    if(['duo','triple','quad'].includes(g.id)) return usr.playType!==null&&usr.wager!==null&&usr.draws!==null;
    const base=usr.boards!==null&&usr.draws!==null&&usr.encore!==null;
    if(g.id==='g650') return base&&usr.addOn!==null;
    return base;
  },[usr,result]);

  const handlePrint=useCallback(()=>{
    if(!canSubmit()) return;
    const r=validate(order,usr);
    // Add ticket to deck
    const tid=++printIdRef.current;
    const g=GAMES[order.gameId];
    const fakeTicket={...order,gameId:order.gameId,gameName:g.name,gameCol:g.col,
      nums:Array.from({length:6},()=>rng(1,49)).sort((a,b)=>a-b),
      bonus:rng(1,20),boards:usr.boards||1,drawDate:new Date().toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}),
      id:Math.random().toString(36).substr(2,4).toUpperCase()+'-'+Math.random().toString(36).substr(2,4).toUpperCase(),
      isWinner:false,_printId:tid};
    setPrintedTickets(p=>[...p,fakeTicket]);
    setResult(r);
    if(isVoice) setTextRevealed(true);
    // If this is a play-again flow, record combined attempt
    if(scanPhase==='playAgain'){
      const decisionOk=getScanDecisionCorrectness(userScanAction,scanTicket);
      const oks=['✅ Scanned ticket correctly'];
      const errs=[];
      if(decisionOk) oks.push(`✅ Correctly processed customer's "${userScanAction}" request`);
      else errs.push(`❌ Customer wanted "${scanTicket.customerWants}" but you chose "${userScanAction}"`);
      if(r.isCorrect) oks.push('✅ Play-again order entered correctly');
      else errs.push('❌ Play-again order had errors (see below)',...r.errs);
      oks.push(...r.oks.filter(o=>o.startsWith('✅')));
      const att={isCorrect:errs.length===0,oks,errs,type:'scan',desc:scanTicket.presentPhrase,order:{sentence:scanTicket.presentPhrase}};
      setAttempts(p=>{const n=[...p,att];setActiveIdx(n.length-1);return n;});
      setScanPhase('done');setScenarioDone(true);
    } else {
      // Regular order - record attempt
      const att={isCorrect:r.isCorrect,oks:r.oks,errs:r.errs,type:'order',order:{...order}};
      setAttempts(p=>{const n=[...p,att];setActiveIdx(n.length-1);return n;});
    }
  },[canSubmit,order,usr,isVoice,scanPhase,userScanAction,scanTicket]);

  const handleHand=useCallback(()=>{
    setHanding(true);
    setTimeout(()=>{setPrintedTickets([]);setHanding(false);setTicketsDone(true);},600);
  },[]);

  const currentGame=usr.selectedGame?GAMES[usr.selectedGame]:null;
  const di=DIFF_INFO[diff];

  const showTopBar=scenarioType==='order'||(scenarioType==='scan'&&(scanPhase==='playAgain'));
  const showGameScreen=showTopBar;
  const showScanPanel=scenarioType==='scan'&&(scanPhase==='presenting'||scanPhase==='revealed');

  // Customer decision buttons for scan
  const showDecisionButtons=scanPhase==='revealed';

  if(screen==='settings') return <SettingsScreen diff={diff} setDiff={setDiff} mode={mode} setMode={setMode} onStart={startGame}/>;

  return(
    <div style={{minHeight:'100vh',background:'linear-gradient(180deg,#1a3a8c,#0a1845)',display:'flex',flexDirection:'column'}}>
      {showTopBar&&<TopBar selected={usr.selectedGame} onSelect={handleSelectGame}/>}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 12px',background:'#070e30',borderBottom:'1px solid #1a2a70'}}>
        <span style={{color:'#ffd700',fontWeight:'bold',fontSize:11,letterSpacing:1}}>🎰 LOTTERY TRAINING</span>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <span style={{fontSize:10,color:diff==='insane'?'#ff4444':diff==='hard'?'#ff8844':diff==='medium'?'#ffd700':'#44ff88'}}>{di.emoji} {di.label}</span>
          {scenarioType==='scan'&&<span style={{fontSize:10,color:'#00cfff',background:'rgba(0,150,255,.15)',padding:'2px 6px',borderRadius:4,border:'1px solid #00cfff44'}}>🎫 TICKET SCAN</span>}
          <button onClick={()=>{window.speechSynthesis.cancel();setScreen('settings');}} style={{fontSize:10,padding:'3px 8px',background:'#1a2a70',border:'1px solid #3a5aaa',borderRadius:4,color:'#8899cc',cursor:'pointer'}}>⚙ Settings</button>
        </div>
      </div>

      <div className="main-flex" style={{display:'flex',flex:1,gap:10,padding:10,alignItems:'flex-start'}}>
        {/* LEFT */}
        <div style={{flex:'1 1 250px',display:'flex',flexDirection:'column',gap:10,minWidth:220}}>
          <CustomerPanel
            scenarioType={scenarioType} order={order} scanTicket={scanTicket} scanPhase={scanPhase}
            isVoice={isVoice} isPlaying={isPlaying} voiceGender={voiceGender}
            onPlay={()=>{setIsPlaying(true);speak(order.sentence,voiceGender,diff,()=>setIsPlaying(false));}}
            onStop={()=>{window.speechSynthesis.cancel();setIsPlaying(false);}}
            result={result} textRevealed={textRevealed} onNext={newScenario}
          />
          <AttemptsPanel attempts={attempts} activeIdx={activeIdx} setActiveIdx={setActiveIdx}/>
        </div>

        {/* RIGHT */}
        <div style={{flex:'2 1 360px',display:'flex',flexDirection:'column',gap:10}}>

          {/* Scan panel */}
          {showScanPanel&&<ScanPanel ticket={scanTicket} scanPhase={scanPhase} onScan={handleScan} scanning={scanning}/>}

          {/* Customer decision buttons */}
          {showDecisionButtons&&(
            <div style={{background:'rgba(8,20,70,.7)',border:'2px solid #3a5aaa',borderRadius:8,padding:14}}>
              <div style={{color:'#ffd700',fontWeight:'bold',fontSize:11,marginBottom:10,letterSpacing:1}}>CUSTOMER DECISION — What does the customer want?</div>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                {scanTicket?.isWinner&&<>
                  <button className="act-btn" style={{background:'#005500',borderColor:'#00aa00',color:'white'}} onClick={()=>handleScanDecision('cash')}>💵 Pay Out Cash ${scanTicket.winAmount}</button>
                  <button className="act-btn" style={{background:'#004488',borderColor:'#0088ff',color:'white'}} onClick={()=>handleScanDecision('playAgain')}>🎫 Play Again (use winnings)</button>
                </>}
                {!scanTicket?.isWinner&&<>
                  <button className="act-btn" style={{background:'#004488',borderColor:'#0088ff',color:'white'}} onClick={()=>handleScanDecision('buyNew')}>🎫 Buy New Ticket</button>
                  <button className="act-btn" style={{background:'#444',borderColor:'#888',color:'white'}} onClick={()=>handleScanDecision('leave')}>↩ Return Ticket / Done</button>
                </>}
              </div>
            </div>
          )}

          {/* Game screen (order mode or play-again) */}
          {showGameScreen&&(
            <div>
              {scanPhase==='playAgain'&&order&&(
                <div style={{background:'rgba(0,80,0,.2)',border:'1px solid #00aa00',borderRadius:6,padding:'6px 12px',marginBottom:8,fontSize:11,color:'#88ff88'}}>
                  🔄 PLAY AGAIN — Now enter the customer's new order below
                </div>
              )}
              <GameScreen game={currentGame} usr={usr} setUsr={setUsr} locked={!!result}/>
            </div>
          )}

          {/* Print deck */}
          {printedTickets.length>0&&<PrintDeck tickets={printedTickets} onHand={handleHand} handing={handing}/>}

          {/* Bottom bar */}
          {(scenarioType==='order'||scanPhase==='playAgain')&&(
            <div style={{display:'flex',gap:10,alignItems:'center',background:'rgba(8,20,70,.7)',border:'2px solid #3a5aaa',borderRadius:8,padding:'9px 13px'}}>
              <div style={{flex:1}}>
                <div style={{color:'#7788bb',fontSize:10}}>Customer Total</div>
                <div style={{color:'#ffd700',fontSize:17,fontWeight:'bold'}}>$0.00</div>
              </div>
              <button className="act-btn" style={{background:'#440000',borderColor:'#aa0000',color:'white'}} onClick={newScenario}>Cancel</button>
              <button className="act-btn"
                style={{background:canSubmit()?'#004400':'#1a1a1a',borderColor:canSubmit()?'#008800':'#333',color:canSubmit()?'white':'#555',cursor:canSubmit()?'pointer':'not-allowed'}}
                onClick={handlePrint} disabled={!canSubmit()}>🎫 Print Ticket</button>
            </div>
          )}

          {!result&&showGameScreen&&(
            <div style={{color:'#445588',fontSize:11,textAlign:'center'}}>
              {!usr.selectedGame?'Select a game tab → set params → Print Ticket':canSubmit()?'Ready — press Print Ticket':'Fill in all required fields'}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
